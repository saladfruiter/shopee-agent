version: "3.8"

services:
  shopee-pipeline:
    build: .
    container_name: shopee-pipeline
    restart: unless-stopped
    env_file: .env
    volumes:
      # Dados persistentes (trends, links, videos, db) — organizado por data
      - /mnt/user/data/shopee_execute:/mnt/user/data/shopee_execute
      # Config editável sem rebuild
      - ./config.yaml:/app/config.yaml:ro
      - ./config/prompts:/app/config/prompts:ro
    environment:
      # Timezone (ajuste para seu fuso)
      TZ: America/Sao_Paulo
